<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<meta name="theme-color" content="#f6f5ef">
<title>{% if page.title and page.title != 'Home' %}{{ page.title }} · {% endif %}Nax — Personal Lab</title>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header"><div class="wrap header-inner">
<a class="logo" href="{{ '/' | relative_url }}"><span class="dot"></span>NAX<span class="muted">/LAB</span></a>
<nav aria-label="Main navigation">
<a href="{{ '/work/' | relative_url }}" {% if page.section == 'work' %}aria-current="page"{% endif %}>Work</a>
<a href="{{ '/about/' | relative_url }}" {% if page.section == 'about' %}aria-current="page"{% endif %}>About</a>
<a href="{{ '/beyond/' | relative_url }}" {% if page.section == 'beyond' %}aria-current="page"{% endif %}>Beyond</a>
<a href="{{ '/' | relative_url }}#contact">Contact ↗</a></nav></div></header>
<main id="main">{{ content }}</main>
<footer id="contact" class="footer"><div class="wrap footer-grid"><div><p class="kicker">OPEN TO CONVERSATIONS</p><h2>Have something <em>in mind?</em></h2><p>Research, engineering, collaboration, or a curious idea.</p><a class="button dark" href="mailto:{{ site.email }}">Get in touch ↗</a></div>
<div class="footer-links"><a href="https://github.com/naxgotomakeit" target="_blank" rel="noopener noreferrer">GitHub ↗</a><a href="mailto:{{ site.email }}">Email ↗</a><span>CV available on request</span></div></div>
<div class="wrap footer-end"><span>© {{ 'now' | date: '%Y' }} Nax · Built with curiosity.</span><span>London, UK</span></div></footer>
</body></html>
